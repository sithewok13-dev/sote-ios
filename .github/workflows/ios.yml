name: iOS shell

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish this build as a GitHub release with this tag (e.g. v0.9.5); leave empty for a plain build
        required: false
        default: ""

# A newer push makes an unfinished run pointless; macOS minutes are costly.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The ROM-free self-test app, for device and simulator. Only on demand and
  # for pull requests now: the game job below builds everything it does.
  build:
    if: github.event_name != 'push'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        sdk: [iphoneos, iphonesimulator]
    steps:
      - uses: actions/checkout@v4

      # SotE-Recomp has its own copies of the runtime and RT64 as submodules;
      # this repo pins the same commits, so don't clone them twice.
      - name: Submodules
        run: |
          git submodule update --init --depth 1 third_party/SotE-Recomp
          git submodule update --init --recursive \
            third_party/N64Recomp third_party/N64ModernRuntime third_party/rt64 third_party/SDL

      - name: Configure
        run: |
          if [ "${{ matrix.sdk }}" = iphoneos ]; then archs=arm64; else archs="arm64;x86_64"; fi
          cmake -S . -B build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=${{ matrix.sdk }} \
            -DCMAKE_OSX_ARCHITECTURES="$archs" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --config Release --target sote sote_game -- \
            -sdk ${{ matrix.sdk }} -IDEBuildingContinueBuildingAfterErrors=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Error summary
        if: failure()
        run: |
          grep -E "error:|Undefined symbols|ld: " build.log | sort -u | head -100

      - name: Package unsigned IPA
        if: matrix.sdk == 'iphoneos'
        run: |
          app=$(find build -path '*Release-iphoneos/SotE.app' -type d | head -1)
          test -n "$app"
          mkdir -p Payload
          cp -R "$app" Payload/
          zip -qry SotE-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        if: matrix.sdk == 'iphoneos'
        with:
          name: SotE-unsigned-ipa
          path: SotE-unsigned.ipa

  # The playable app. The owner's ROM, encrypted, lives in their private
  # files repo (branch sote-rom), read with the JK_FILES_TOKEN secret and
  # unlocked with SOTE_ROM_KEY; without both this job does nothing. The
  # unlocked ROM is deleted once the game code is generated, and is never put
  # in the IPA: like SotE-Recomp's Windows release, players supply their own.
  game:
    runs-on: macos-15
    if: github.event_name != 'pull_request'
    permissions:
      contents: write  # the release, when one is asked for
    env:
      SOTE_ROM_KEY: ${{ secrets.SOTE_ROM_KEY }}
      JK_FILES_TOKEN: ${{ secrets.JK_FILES_TOKEN }}
      RELEASE_TAG: ${{ inputs.release }}
    steps:
      - name: Check for the ROM and its key
        id: key
        run: |
          if [ -n "$SOTE_ROM_KEY" ] && [ -n "$JK_FILES_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::SOTE_ROM_KEY or JK_FILES_TOKEN is not set; skipping the game build."
            if [ -n "$RELEASE_TAG" ]; then echo "::error::A release needs the game build"; exit 1; fi
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
        with:
          repository: sithewok13-dev/jk-files
          ref: sote-rom
          token: ${{ secrets.JK_FILES_TOKEN }}
          path: rom-store
          persist-credentials: false

      - name: Submodules
        if: steps.key.outputs.present == 'true'
        run: |
          git submodule update --init --depth 1 third_party/SotE-Recomp
          git submodule update --init --recursive \
            third_party/N64Recomp third_party/N64ModernRuntime third_party/rt64 third_party/SDL

      - name: Unlock the ROM
        if: steps.key.outputs.present == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/rom"
          printf '%s' "$SOTE_ROM_KEY" | gpg --batch --quiet --pinentry-mode loopback \
            --passphrase-fd 0 -d -o "$RUNNER_TEMP/rom/sote.z64" rom-store/sote.z64.gpg
          rm -rf rom-store
          echo "e7085e013123537f34e0edec8801318016da4dbac424172d6dc5f3b67d98642c  $RUNNER_TEMP/rom/sote.z64" \
            | shasum -a 256 -c -

      - name: Generate the game code
        if: steps.key.outputs.present == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet unicorn==2.1.4 xxhash==4.0.1
          cmake -S third_party/N64Recomp -B "$RUNNER_TEMP/n64recomp" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/n64recomp" --target N64RecompCLI RSPRecomp --parallel
          cd third_party/SotE-Recomp
          "$RUNNER_TEMP/venv/bin/python" tools/prepare_recomp_rom.py "$RUNNER_TEMP/rom/sote.z64"
          "$RUNNER_TEMP/n64recomp/N64Recomp" sote.toml
          "$RUNNER_TEMP/n64recomp/RSPRecomp" config/aspMain.toml
          "$RUNNER_TEMP/venv/bin/python" tools/patch_rsp_audio.py
          rm -f generated/recomp.z64 "$RUNNER_TEMP/rom/sote.z64"
          ls generated generated/RecompiledFuncs | head -40

      - name: Configure
        if: steps.key.outputs.present == 'true'
        run: |
          cmake -S . -B build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            "-DSOTE_GENERATED_DIR=$PWD/third_party/SotE-Recomp/generated"

      - name: Build
        if: steps.key.outputs.present == 'true'
        run: |
          set -o pipefail
          cmake --build build --config Release --target sote -- \
            -sdk iphoneos -IDEBuildingContinueBuildingAfterErrors=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Error summary
        if: failure() && steps.key.outputs.present == 'true'
        run: |
          grep -E "error:|Undefined symbols|ld: " build.log | sort -u | head -100

      - name: Package the game IPA
        if: steps.key.outputs.present == 'true'
        run: |
          app=$(find build -path '*Release-iphoneos/SotE.app' -type d | head -1)
          test -n "$app"
          mkdir -p Payload
          cp -R "$app" Payload/
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$app/Info.plist")
          echo "IPA_NAME=SotE-iOS-$version.ipa" >> "$GITHUB_ENV"
          zip -qry "SotE-iOS-$version.ipa" Payload
          ls -l "SotE-iOS-$version.ipa"
          # No ROM in the app, under any name: no file starting like an N64
          # image (any byte order), and no encrypted copy.
          python3 - <<'PY'
          import os, sys
          heads = {bytes.fromhex(h) for h in ("80371240", "37804012", "40123780")}
          bad = []
          for root, _, files in os.walk("Payload"):
              for name in files:
                  path = os.path.join(root, name)
                  with open(path, "rb") as f:
                      if f.read(4) in heads or name.lower().endswith((".z64", ".v64", ".n64", ".gpg")):
                          bad.append(path)
          if bad:
              print("::error::The app holds something that looks like the ROM: " + ", ".join(bad))
              sys.exit(1)
          print("No ROM in the app.")
          PY
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.present == 'true'
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.IPA_NAME }}
          retention-days: 30

      - name: Publish the release
        if: steps.key.outputs.present == 'true' && env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG doesn't match the app's version $VERSION"; exit 1
          fi
          grep -qx "### What's in $RELEASE_TAG" docs/RELEASE_NOTES.md || {
            echo "::error::docs/RELEASE_NOTES.md has no line \"### What's in $RELEASE_TAG\""; exit 1; }
          gh release create "$RELEASE_TAG" "$IPA_NAME" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Shadows of the Empire for iOS $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md --latest
